[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "synthium"
version = "9.0.0"
description = "Building and testing measurement rulers for abstract concepts; judicial domain first."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary / research" }
authors = [{ name = "Sina" }]
keywords = ["measurement", "validation", "legal-analytics", "research-framework"]
# The whole package runs on the Python standard library.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
synthium = "synthium.cli:main"

[tool.setuptools.packages.find]
include = ["synthium*"]

[tool.setuptools.package-data]
"synthium.domains.judicial" = ["params/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
