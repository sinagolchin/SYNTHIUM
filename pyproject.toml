[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "synthium"
version = "9.0.0"
description = "Building and testing measurement rulers for abstract concepts; judicial domain first."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "LicenseRef-PolyForm-Strict-1.0.0 (code); CC-BY-NC-ND-4.0 (docs and data), see LICENSE and LICENSE-DOCS-DATA.md" }
authors = [{ name = "Sina" }]
keywords = ["measurement", "validation", "legal-analytics", "research-framework"]
# The whole package runs on the Python standard library.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]
# The geometry module (synthium.geometry) needs numpy; the rest of the package does not.
geometry = ["numpy>=1.20"]
# Restored earlier versions (synthium.legacy) and the phenomena module. V1 to V3.4, V5 and
# synthium.phenomena need numpy; V4 and V4.3.1 also need scipy and scikit-learn.
legacy = ["numpy>=1.20", "scipy>=1.7", "scikit-learn>=1.0"]
# V4.3.1's neural encoder (synthium.legacy.v4_3_1.neural) needs PyTorch.
legacy-neural = ["numpy>=1.20", "scipy>=1.7", "scikit-learn>=1.0", "torch>=1.10"]
# SynthiumBot (synthium.legacy.synthiumbot); set TELEGRAM_TOKEN in the environment.
legacy-bot = ["numpy>=1.20", "scipy>=1.7", "scikit-learn>=1.0", "python-telegram-bot>=20"]

[project.scripts]
synthium = "synthium.cli:main"

[tool.setuptools.packages.find]
include = ["synthium*"]

[tool.setuptools.package-data]
"synthium.domains.judicial" = ["params/*.json"]
"synthium.legacy" = ["*/data/*.json", "*/data_files/*", "*/data_files/**/*",
                     "v4_3_1/outputs_neural_judicial/*", "v4_3_1/outputs_deleaked/*",
                     "v4_3_1/examples/*", "*/README.md", "*/requirements.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
